# Gradle
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5006
org.gradle.caching=true
# Disabled: with configure-on-demand, :fabric is not configured when running :neoforge:runClient,
# but prepareArchitecturyTransformer queries all Loom projects and fails with
# "Cannot get MappingsProvider before it has been setup".
org.gradle.configureondemand=false
# IntelliJ's run configs don't work with the configuration cache
org.gradle.configuration-cache=false
# Loom
fabric.loom.multiProjectOptimisation=true
# it appears that this must be false to work with neoforge/arch loom, but true for common/fabric
fabric.loom.dropNonIntermediateRootMethods=true
loom.ignoreDependencyLoomVersionValidation=true
# Mod Metadata
mavenGroup=io.github.slimeistdev
user=techno-sam
slug=crystalline-sky
modId=crystalline_sky
modName=Crystalline Sky
modDescription= Crystallizes the heavens into block form. For all your sky-in-a-cave needs.
authors=Slimeist
contributors=
license=EUPL 1.2 or later
# Mod Version
modVersion=0.2.1
# Branch Metadata
branchName=1.21.1
compatibleVersions=1.21.1

# mod compat (compileOnly)
enable_sodium=true
enable_iris=true
# modLocalRuntime for Sodium/Iris hangs NeoForge dev startup for minutes (mixin stalls on RenderTarget).
# For in-game Sodium/Iris testing, copy the jars into neoforge/run/mods/ instead.
enable_sodium_runtime=false
enable_iris_runtime=false
enable_axiom=false
